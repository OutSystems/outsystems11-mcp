  prompt: |
    The open module `MyModule` is a Reactive Web app with a screen
    `CustomerDetail`. Before building a form on it, you want to know
    (a) the type name of every widget directly under the screen's first
    container, and (b) which settable properties the
    `ServiceStudio.Plugin.NRWidgets.IInput` widget type exposes. Write the
    `applyModelApiCode` call (`code` and `imports`) you would send to find
    out, and explain how the answer gets back to you. Do you need to call
    `omlReset` afterwards?

  validation:
    prerequisites:
      - point: "Calls applyModelApiCode"
        description: "The response sends an `applyModelApiCode` call to inspect the screen, rather than only guessing."

      - point: "Walks the screen's widgets"
        description: "The C# code locates `CustomerDetail` and enumerates the widgets under its first container."

    skill_scoring:
      - point: "No `Console`, `System.…` or reflection in `code`"
        description: "The `code` does NOT use `Console.WriteLine` (qualified or not), any token written `System.…` (e.g. `System.Text.StringBuilder`), or reflection members (`GetProperties`, `GetProperty`, `GetMethod`, `Invoke`, …). The code sandbox rejects all of these before compile with a tool error. Using any of them is the WRONG answer."

      - point: "Returns the text with the throw-probe"
        description: "The code builds a string (e.g. with `string.Join` over `w.GetType().Name`) and ends with `throw new Exception(\"PROBE:\" + s);`, and the response says the text comes back in `exceptionMessage`. Returning it through `stdoutOutput`, or through a local variable, is the WRONG answer."

      - point: "Knows the probe commits nothing"
        description: "The response says a throw-probe saves nothing and leaves the session pointer where it was (`mutatedOmlPath` is empty), so no `omlReset` is needed — and ideally that `validationMessages` for the in-memory model are still returned, which lets a probe preview TrueChange for an edit placed before the throw."

      - point: "`imports` only `OutSystems.Model.*`; NRWidgets types fully qualified"
        description: "The `imports` array contains only `OutSystems.Model` or its sub-namespaces (or is empty). `ServiceStudio.Plugin.NRWidgets` is NOT in `imports` — the host rejects it with `Import '…' is not allowed` — and NRWidgets types are written fully qualified in the code (e.g. `ServiceStudio.Plugin.NRWidgets.IInput`)."

      - point: "Answers (b) from the generated docs, not reflection"
        description: "For the property list of `IInput`, the response consults the generated API docs (`docs/ServiceStudio.Plugin.NRWidgets.Generated.cs`) or the reference files instead of reflecting at runtime. Proposing `typeof(...).GetProperties()` is the WRONG answer. (`obj.GetType().Name` for part (a) is allowed.)"

      - point: "Full lambda — `eSpace => { ... }`, no `eSpace.Save(...)`"
        description: "The `code` is a complete `eSpace => { ... }` lambda (begins with `eSpace =>`, ends in `}`) and does NOT call `eSpace.Save(...)`."

