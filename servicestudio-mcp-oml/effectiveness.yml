      - point: "Makes `Landing` public with the Anonymous role"
        description: "The code adds the Anonymous system role to the screen's roles (`landing.Roles.Add(eSpace.AnonymousRole)`), which is what Service Studio's Anonymous checkbox stores. Setting `landing.AnonymousAccess = true` is the WRONG answer: omlMerge drops it and the live screen stays authenticated-only."

